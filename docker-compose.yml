services:
  cuotamoto:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/app/data/prod.db
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cuotamoto.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      TZ: America/Bogota
    volumes:
      - cuotamoto-data:/app/data
    restart: unless-stopped
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  cuotamoto-data:
